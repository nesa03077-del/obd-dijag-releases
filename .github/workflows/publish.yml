# Kad se gurne tag v* (npr. v0.1.0), objavljuje GitHub Release sa APK-om iz foldera apk/.
# Aplikacija OBD Dijag (Podešavanja -> Proveri ažuriranja) čita poslednje izdanje odavde.
name: Objavi izdanje

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          name: OBD Dijag ${{ github.ref_name }}
          files: apk/OBDDijag-${{ github.ref_name }}.apk
          body_path: notes/${{ github.ref_name }}.md
          make_latest: true
